<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제하기 - ClickNova</title>
    <!-- Toss Payments Widget SDK -->
    <script src="https://js.tosspayments.com/v1/payment-widget"></script>
    <style>
        :root {
            --primary: #3182f6;
            --bg: #f4f7fa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            margin: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header img {
            width: 150px;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.5rem;
            color: #191f28;
            margin: 0;
        }

        .price-info {
            background: #f9fafb;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price-info .label {
            color: #4e5968;
            font-size: 1rem;
        }

        .price-info .amount {
            color: #191f28;
            font-size: 1.25rem;
            font-weight: bold;
        }

        #payment-button {
            width: 100%;
            height: 60px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.125rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s;
        }

        #payment-button:hover {
            background-color: #1b64da;
        }

        /* Mobile adjustment */
        @media (max-width: 480px) {
            .container {
                padding: 25px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <img src="public/image-removebg-preview (1).png" alt="ClickNova">
            <h1>서비스 결제</h1>
        </div>

        <div class="price-info">
            <span class="label">결제 금액</span>
            <span class="amount" id="display-amount">600,000원</span>
        </div>

        <!-- 결제 UI가 렌더링될 영역 -->
        <div id="payment-method"></div>
        <!-- 이용약관 UI가 렌더링될 영역 -->
        <div id="agreement"></div>

        <button id="payment-button">결제하기</button>
    </div>

    <script>
        const clientKey = "test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm"; // 테스트 클라이언트 키
        const customerKey = "GUEST_" + Math.random().toString(36).substring(2, 11);

        const paymentWidget = PaymentWidget(clientKey, customerKey);

        // URL 파라미터에서 금액 가져오기 (기본값 600,000)
        const urlParams = new URLSearchParams(window.location.search);
        const amountValue = parseInt(urlParams.get('amount')) || 600000;
        document.getElementById('display-amount').innerText = amountValue.toLocaleString() + '원';

        // 결제 UI 렌더링
        paymentWidget.renderPaymentMethods(
            "#payment-method",
            { value: amountValue },
            { variantKey: "DEFAULT" }
        );

        // 이용약관 UI 렌더링
        paymentWidget.renderAgreement("#agreement", { variantKey: "AGREEMENT" });

        // 결제 요청
        document.getElementById("payment-button").addEventListener("click", () => {
            paymentWidget.requestPayment({
                orderId: "ORDER_" + Date.now(),
                orderName: "ClickNova 웹 솔루션 서비스",
                successUrl: window.location.origin + "/success",
                failUrl: window.location.origin + "/fail",
            });
        });
    </script>
</body>

</html>
