<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제하기 - ClickNova</title>
    <!-- Toss Payments v2 Standard SDK -->
    <script src="https://js.tosspayments.com/v2/standard"></script>

    <style>
        :root {
            --primary: #3182f6;
            --bg: #f4f7fa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            margin: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header img {
            width: 150px;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.5rem;
            color: #191f28;
            margin: 0;
        }

        .price-info {
            background: #f9fafb;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price-info .label {
            color: #4e5968;
            font-size: 1rem;
        }

        .price-info .amount {
            color: #191f28;
            font-size: 1.25rem;
            font-weight: bold;
        }

        #payment-button {
            width: 100%;
            height: 60px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.125rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s;
        }

        #payment-button:hover {
            background-color: #1b64da;
        }

        /* Amount selection styles */
        .amount-selector {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 30px;
        }

        .amount-btn {
            background: white;
            border: 1px solid #e5e8eb;
            padding: 15px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            color: #4e5968;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .amount-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .amount-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Mobile adjustment */
        @media (max-width: 480px) {
            .container {
                padding: 25px;
            }
            .amount-selector {
                grid-template-columns: repeat(2, 1fr);
            }
        }

    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <img src="public/image-removebg-preview (1).png" alt="ClickNova">
            <h1>서비스 결제</h1>
        </div>

        <div class="price-info">
            <span class="label">결제 금액</span>
            <span class="amount" id="display-amount">600,000원</span>
        </div>

        <div class="amount-selector" id="amount-selector">
            <button class="amount-btn" data-value="10000">1만원</button>
            <button class="amount-btn" data-value="30000">3만원</button>
            <button class="amount-btn" data-value="50000">5만원</button>
            <button class="amount-btn" data-value="100000">10만원</button>
            <button class="amount-btn" data-value="500000">50만원</button>
            <button class="amount-btn active" data-value="600000">60만원</button>
            <button class="amount-btn" data-value="1000000">100만원</button>
            <button class="amount-btn" data-value="1500000">150만원</button>
            <button class="amount-btn" data-value="2000000">200만원</button>
            <button class="amount-btn" data-value="3000000">300만원</button>
            <button class="amount-btn" data-value="5000000">500만원</button>
        </div>

        <!-- 결제 UI가 렌더링될 영역 -->

        <div id="payment-method"></div>
        <!-- 이용약관 UI가 렌더링될 영역 -->
        <div id="agreement"></div>

        <button id="payment-button">결제하기</button>
    </div>

    <script>
        const clientKey = "live_ck_ex6BJGQOVD9qGqbX49YqrW4w2zNb"; // 라이브 클라이언트 키
        const customerKey = "GUEST_" + Math.random().toString(36).substring(2, 11);

        const tossPayments = TossPayments(clientKey);
        const payment = tossPayments.payment({ customerKey });

        // 현재 선택된 금액 관리
        let currentAmount = 600000;

        // URL 파라미터에서 금액 가져오기 (기본값 600,000)
        const urlParams = new URLSearchParams(window.location.search);
        const initialAmount = parseInt(urlParams.get('amount')) || 600000;
        updateAmount(initialAmount);

        // 금액 버튼 클릭 이벤트 설정
        const amountBtns = document.querySelectorAll('.amount-btn');
        amountBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const value = parseInt(btn.getAttribute('data-value'));
                updateAmount(value);
                
                // 버튼 활성화 상태 변경
                amountBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
            
            // 초기 활성화 상태 설정
            if (parseInt(btn.getAttribute('data-value')) === initialAmount) {
                amountBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }
        });

        function updateAmount(value) {
            currentAmount = value;
            document.getElementById('display-amount').innerText = value.toLocaleString() + '원';
        }

        // 결제 요청
        document.getElementById("payment-button").addEventListener("click", async () => {
            try {
                await payment.requestPayment({
                    method: "CARD", // 카드 결제
                    amount: {
                        currency: "KRW",
                        value: currentAmount,
                    },
                    orderId: "ORDER_" + Date.now(),
                    orderName: "ClickNova 웹 솔루션 서비스",
                    successUrl: window.location.origin + "/success",
                    failUrl: window.location.origin + "/fail",
                    card: {
                        flowMode: "DEFAULT",
                    },
                });
            } catch (error) {
                console.error('결제 요청 에러:', error);
                alert('결제 요청 중 오류가 발생했습니다: ' + error.message);
            }
        });
    </script>


</body>

</html>
